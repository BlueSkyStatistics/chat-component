name: Security scan

# Runs secret, dependency, Electron and code-pattern scanners and publishes one
# Markdown report (job summary + "security-report" artifact). Each report is
# compared with the previous successful run on the same branch, so new and
# resolved findings are listed. Findings never fail the workflow.

# Note: GitHub only shows the "Run workflow" button, and only runs the schedule,
# when this file is on the repository's default branch.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read
  actions: read # to download the previous run's report for comparison

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Scheduled runs always start from the default branch, so they scan this branch instead.
  # Manual runs scan the branch picked in "Run workflow".
  SCAN_BRANCH: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
  # Repo-specific settings.
  SCAN_ELECTRON: 'false'
  ESLINT_TARGETS: 'src/**/*.{js,jsx}'
  # Pinned tool versions, so changes between reports come from the code, not the tools.
  GITLEAKS_VERSION: '8.21.2'
  OSV_SCANNER_VERSION: '1.9.1'
  SEMGREP_VERSION: '1.182.1'
  RESULTS: ${{ github.workspace }}/../scan-results
  REPORT: ${{ github.workspace }}/../scan-report
  TOOLS: ${{ github.workspace }}/../scan-tools

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SCAN_BRANCH }}
          fetch-depth: 0 # full history for the secrets scan
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install scanners
        run: |
          echo "SCAN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=security-report-${SCAN_BRANCH//\//-}" >> "$GITHUB_ENV"
          mkdir -p "$RESULTS" "$REPORT" "$TOOLS/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C "$TOOLS/bin" gitleaks
          curl -sSfL -o "$TOOLS/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$TOOLS/bin/osv-scanner"
          python -m pip install --quiet "semgrep==${SEMGREP_VERSION}"
          npm install --prefix "$TOOLS" --no-audit --no-fund --silent \
            eslint@9.39.5 eslint-plugin-security@4.2.0 eslint-plugin-no-unsanitized@4.1.5 \
            @microsoft/eslint-plugin-sdl@1.1.0 @doyensec/electronegativity@1.10.3
          echo "$TOOLS/bin" >> "$GITHUB_PATH"

      - name: Prepare lockfile for dependency audit
        run: |
          notes=""
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
            notes="No package-lock.json is committed; one was generated at scan time, so dependency results reflect a fresh install today."
          fi
          if [ -f .gitmodules ]; then
            notes="${notes:+$notes||}Git submodules are not checked out or scanned."
          fi
          echo "SCAN_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Secrets (gitleaks, full history)
        run: |
          gitleaks git . --log-opts="--all" --config .github/security/gitleaks.toml \
            --report-format json --report-path "$RESULTS/gitleaks.json" \
            --redact=60 --exit-code 0 --no-banner

      - name: Dependencies (npm audit)
        run: npm audit --json > "$RESULTS/npm-audit.json" || true

      - name: Dependencies (OSV-Scanner)
        run: osv-scanner --format json --lockfile package-lock.json > "$RESULTS/osv.json" || true

      - name: Electron configuration (Electronegativity)
        if: env.SCAN_ELECTRON == 'true'
        run: |
          "$TOOLS/node_modules/.bin/electronegativity" -i . -o "$RESULTS/electronegativity.csv" \
            || echo "Electronegativity failed; the report will mark it as not run."

      - name: Code patterns (Semgrep)
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          semgrep scan --metrics=off --json --output "$RESULTS/semgrep.json" \
            --config p/javascript --config p/react --config p/secrets \
            --config .github/security/semgrep-rules.yml \
            --exclude node_modules --exclude vendor --exclude '*.min.js' --exclude dist \
            --exclude 'src/chat-component' --exclude 'svg-edit' . || true

      - name: Code patterns (ESLint security plugins)
        run: |
          # ESLint resolves plugins and ignore paths from the config's folder, so run it from the repo root.
          cp .github/security/eslint.config.mjs ./eslint.security.config.mjs
          [ -e node_modules ] || ln -s "$TOOLS/node_modules" node_modules
          "$TOOLS/node_modules/.bin/eslint" --config eslint.security.config.mjs --format json \
            --output-file "$RESULTS/eslint.json" "$ESLINT_TARGETS" || true
          rm -f eslint.security.config.mjs
          [ -L node_modules ] && rm node_modules || true

      - name: Download previous report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the most recent earlier run that has a report for this branch.
          mkdir -p "$RUNNER_TEMP/previous"
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow security-scan.yml \
              --status success --limit 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D "$RUNNER_TEMP/previous" 2>/dev/null; then
              echo "Comparing with run $run_id"
              break
            fi
          done

      - name: Build report
        run: |
          python .github/security/build_report.py "$RESULTS" "$REPORT" "$RUNNER_TEMP/previous"
          cat "$REPORT/report.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$REPORT/raw" && cp "$RESULTS"/* "$REPORT/raw/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPORT }}
          retention-days: 90
